name: build-apk
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build engine libs
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          export NDK_DIR=$ANDROID_HOME/ndk/28.2.13676358
          export EDGE0_DEPOT=$GITHUB_WORKSPACE   # script default uses 'pwd -W' (Windows-only)
          cd android && bash tools/llama/build_vendor_libs.sh
      - name: Build APK
        run: cd android && ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: edge0-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
